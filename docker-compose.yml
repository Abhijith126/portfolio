services:
  portfolio:
    image: portfolio:${PORTFOLIO_VERSION:?Set PORTFOLIO_VERSION in .env to the downloaded release version}
    pull_policy: never
    container_name: portfolio
    restart: unless-stopped
    init: true
    ports:
      - "${PORTFOLIO_PORT:-5172}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
