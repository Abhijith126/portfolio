name: Build and release app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Compile standalone app for Linux x86-64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: build-files
          platforms: linux/amd64
          outputs: type=local,dest=release/app
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create build ZIP
        run: |
          printf '%s\n' "$GITHUB_SHA" > release/app/BUILD_COMMIT
          (cd release/app && zip -qry --symlinks ../portfolio-build.zip .)
          (cd release && sha256sum portfolio-build.zip > portfolio-build.zip.sha256)
      - name: Run the packaged app
        run: |
          docker run -d --name portfolio-smoke \
            -p 127.0.0.1:5172:3000 \
            -e NODE_ENV=production -e HOSTNAME=0.0.0.0 -e PORT=3000 \
            -v "$PWD/release:/release:ro" \
            node:22-alpine sh -ec '
              apk add --no-cache unzip su-exec
              mkdir -p /app
              cd /release
              sha256sum -c portfolio-build.zip.sha256
              unzip -q portfolio-build.zip -d /app
              chown -R node:node /app
              cd /app
              exec su-exec node node server.js
            '
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:5172/ -o release/page.html
          curl --fail --silent --show-error http://127.0.0.1:5172/data/profile.json | python3 -m json.tool > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:5172/data/projects.json | python3 -m json.tool > /dev/null
          ASSET=$(python3 -c 'import re; print(re.search(r"src=\"([^\"]*/_next/static/[^\"]+\.js)\"", open("release/page.html").read())[1])')
          curl --fail --silent --show-error "http://127.0.0.1:5172$ASSET" -o /dev/null
      - name: Show app logs
        if: failure()
        run: docker logs portfolio-smoke || true
      - name: Stop app
        if: always()
        run: docker rm -f portfolio-smoke || true
      - name: Store build ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-build
          path: |
            release/portfolio-build.zip
            release/portfolio-build.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portfolio-build
          path: release
      - name: Publish this main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="build-$GITHUB_RUN_NUMBER-${GITHUB_SHA:0:12}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "$TAG" \
              --notes "Compiled Next.js standalone build for Linux x86-64 with Node.js 22 Alpine. Includes server.js, runtime dependencies, public files, and .next/static. Docker Compose is managed separately on the deployment server."
          fi
          gh release upload "$TAG" release/portfolio-build.zip release/portfolio-build.zip.sha256 --clobber
          # A slow older build must not replace a newer main commit as latest.
          MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          LATEST=false
          if [[ "$MAIN_SHA" == "$GITHUB_SHA" ]]; then LATEST=true; fi
          gh release edit "$TAG" --draft=false --latest="$LATEST"
